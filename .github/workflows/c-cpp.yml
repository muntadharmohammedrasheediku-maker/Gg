name: Build MyHook Dylib

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    name: Build Dylib on macOS
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # ---------- 1. Checkout ----------
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 2. Setup Xcode ----------
      - name: 🛠️ Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # ---------- 3. Cache Theos ----------
      - name: 💾 Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: ${{ runner.os }}-theos-v3

      # ---------- 4. Install Theos ----------
      - name: 📦 Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p $THEOS
          sudo chown -R $(id -u):$(id -g) $THEOS
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git $THEOS
          sudo $THEOS/bin/install-theos || true

      # ---------- 5. Configure Theos ----------
      - name: 🔧 Configure Theos
        run: |
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          ls -la $THEOS/makefiles/ | head

      # ---------- 6. Install ldid + dpkg ----------
      - name: 🔐 Install ldid & dpkg
        run: |
          brew install ldid dpkg || true
          cp $(which ldid) $THEOS/bin/ldid || true
          chmod +x $THEOS/bin/ldid || true

      # ---------- 7. Verify files ----------
      - name: 📋 Verify files
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Check required files ==="
          test -f Makefile     && echo "✅ Makefile"     || exit 1
          test -f MyHook.mm    && echo "✅ MyHook.mm"    || exit 1
          test -f dobby.h      && echo "✅ dobby.h"      || exit 1
          test -f libdobby.a   && echo "✅ libdobby.a"   || exit 1

      # ---------- 8. Build Dylib ----------
      - name: 🔨 Build Dylib
        run: |
          export THEOS=$THEOS
          export PATH=$THEOS/bin:$PATH
          
          echo "=== Clean ==="
          make clean || true
          
          echo "=== Build ==="
          make package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e" \
            -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log
          
          echo "=== Build exit: $? ==="

      # ---------- 9. Verify output ----------
      - name: 🔍 Verify output
        run: |
          echo "=== Packages ==="
          ls -la packages/ || true
          
          echo "=== Dylibs ==="
          find .theos -name "*.dylib" -type f -exec lipo -info {} \; || true
          
          DYLIB=$(find .theos -name "MyHook.dylib" -type f | head -1)
          if [ -n "$DYLIB" ]; then
            echo "✅ Dylib: $DYLIB"
            lipo -info "$DYLIB"
            ls -lh "$DYLIB"
          fi

      # ---------- 10. Upload Dylib ----------
      - name: 📤 Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/debug/**/*.dylib
          if-no-files-found: warn
          retention-days: 30

      # ---------- 11. Upload .deb ----------
      - name: 📤 Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      # ---------- 12. Upload build log ----------
      - name: 📤 Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # ---------- 13. Release on tag ----------
      - name: 🚀 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            .theos/obj/**/*.dylib
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
