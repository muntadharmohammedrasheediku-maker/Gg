name: Build MyHook Dylib

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    name: Build Dylib (arm64 + arm64e)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 💾 Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: ${{ runner.os }}-theos-v6

      - name: 📦 Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p "$THEOS"
          sudo chown -R "$(id -u):$(id -g)" "$THEOS"
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git "$THEOS"
          echo "✅ Theos cloned"

      - name: 🔐 Install ldid (prebuilt binary → \$THEOS/bin)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x /tmp/ldid
          cp /tmp/ldid "$THEOS/bin/ldid"
          chmod +x "$THEOS/bin/ldid"
          "$THEOS/bin/ldid" -v 2>&1 | head -3 || true
          echo "✅ ldid installed at $THEOS/bin/ldid"

      - name: 🔧 Configure Theos
        run: |
          set -euo pipefail
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          test -x "$THEOS/bin/ldid" || { echo "❌ ldid missing"; exit 1; }
          ls -la "$THEOS/bin/ldid"

      - name: 📋 Verify files
        run: |
          set -euo pipefail
          ls -la
          test -f Makefile     || { echo "❌ Makefile missing";    exit 1; }
          test -f MyHook.mm    || { echo "❌ MyHook.mm missing";   exit 1; }
          test -f dobby.h      || { echo "❌ dobby.h missing";     exit 1; }
          test -f libdobby.a   || { echo "❌ libdobby.a missing";  exit 1; }
          echo "✅ All required files present"

      - name: 🔨 Build with Theos
        run: |
          set -euo pipefail
          export THEOS="$THEOS"
          export PATH="$THEOS/bin:$PATH"

          echo "=== Clean ==="
          make clean

          echo "=== Build (arm64 + arm64e) ==="
          make package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e" \
            -j"$(sysctl -n hw.ncpu)" 2>&1 | tee build.log

      - name: 🔍 Verify output
        run: |
          set -euo pipefail
          ls -la packages/

          DYLIB="$(find .theos -name 'MyHook.dylib' -type f | head -1)"
          [ -n "$DYLIB" ] || { echo "❌ MyHook.dylib not found"; exit 1; }
          echo "✅ Dylib: $DYLIB"
          ls -lh "$DYLIB"
          lipo -info "$DYLIB"

          ARCHS="$(lipo -archs "$DYLIB")"
          echo "Detected archs: $ARCHS"
          echo "$ARCHS" | grep -qw "arm64"  || { echo "❌ arm64 missing";  exit 1; }
          echo "$ARCHS" | grep -qw "arm64e" || { echo "❌ arm64e missing"; exit 1; }
          echo "✅ Both arm64 and arm64e present"

      - name: 📤 Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-dylib
          path: .theos/obj/MyHook.dylib
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 🚀 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            .theos/obj/MyHook.dylib
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
