name: build-shadowbypass

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fetch fishhook (fallback if submodule missing)
        run: |
          if [ ! -f deps/fishhook/fishhook.h ]; then
            mkdir -p deps/fishhook
            curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h \
              -o deps/fishhook/fishhook.h
            curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c \
              -o deps/fishhook/fishhook.c
          fi

      - name: Force ObjC++ for the entry source
        run: |
          # ShadowBypassXK.m uses <cstring>, <cstdint>, nullptr, ptrauth —
          # clang reads the extension to pick the language, .m → ObjC,
          # and fails at the first C++ header. Rename to .mm so clang
          # drives the C++ frontend; keep a backup in case you want to
          # restore the original name.
          if [ -f ShadowBypassXK.m ] && [ ! -f ShadowBypassXK.mm ]; then
            cp -f ShadowBypassXK.m ShadowBypassXK.m.bak
            mv ShadowBypassXK.m ShadowBypassXK.mm
          fi

      - name: Syntax check
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang++ \
            -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc -O0 \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            -Wno-unguarded-availability \
            -I deps \
            -fsyntax-only \
            ShadowBypassXK.mm

      - name: Build dylib
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang++ \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc -O2 -dynamiclib \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            -Wno-unguarded-availability \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,@rpath/ShadowBypassXK.dylib \
            -I deps \
            ShadowBypassXK.mm deps/fishhook/fishhook.c \
            -framework Foundation -framework UIKit -framework Security \
            -framework AdSupport -framework AppTrackingTransparency \
            -framework CoreFoundation -framework CoreGraphics \
            -o ShadowBypassXK.dylib

      - name: Verify output
        run: |
          set -Eeuo pipefail
          file ShadowBypassXK.dylib
          lipo -info ShadowBypassXK.dylib
          otool -D ShadowBypassXK.dylib
          otool -L ShadowBypassXK.dylib | head -20
          nm -u ShadowBypassXK.dylib | grep -E "rebind_symbols|AnoSDK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowBypassXK
          path: ShadowBypassXK.dylib
