name: build-shadowbypass

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Clone Titanox (headers + sources)
        run: |
          if [ ! -d deps/Titanox ]; then
            git clone --recursive --depth 1 \
              https://github.com/Ragekill3377/Titanox.git deps/Titanox
          fi
          echo "=== Titanox layout ==="
          find deps/Titanox -maxdepth 3 -type d | head -30
          echo "=== libtitanox.h ==="
          ls -la deps/Titanox/libtitanox/libtitanox/libtitanox.h || true

      - name: Force ObjC++ source extension
        run: |
          if [ -f ShadowBypassXK.m ] && [ ! -f ShadowBypassXK.mm ]; then
            cp -f ShadowBypassXK.m ShadowBypassXK.m.bak
            mv ShadowBypassXK.m ShadowBypassXK.mm
          fi

      - name: Build unified ShadowBypassXK.dylib
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          TX_ROOT="deps/Titanox/libtitanox"
          if [ ! -f "$TX_ROOT/libtitanox/libtitanox.h" ]; then
            echo "::error::libtitanox.h not found at $TX_ROOT/libtitanox/"
            find deps/Titanox -name "libtitanox.h" || true
            exit 1
          fi

          # Compile every .mm/.cpp/.c inside the Titanox library tree into our dylib.
          # Exclude test/main sources and git metadata.
          TX_SRCS=$(find "$TX_ROOT" -type f \
            \( -name "*.mm" -o -name "*.cpp" -o -name "*.c" \) \
            ! -path "*/.git/*" \
            ! -name "main.*" \
            ! -name "*test*" \
            | sort -u | tr '\n' ' ')

          if [ -z "$TX_SRCS" ]; then
            echo "::error::No Titanox sources under $TX_ROOT"
            exit 1
          fi

          echo "Titanox sources:"
          for f in $TX_SRCS; do echo "  $f"; done

          clang++ \
            -std=gnu++17 \
            -arch arm64e -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc -O2 -dynamiclib \
            -Wno-incompatible-pointer-types \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            -Wno-unguarded-availability \
            -Wno-c++11-narrowing \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,@rpath/ShadowBypassXK.dylib \
            -I "$TX_ROOT" \
            -I "$TX_ROOT/libtitanox" \
            -I "$TX_ROOT/libtitanox/fishhook" \
            -I "$TX_ROOT/libtitanox/mempatch" \
            -I "$TX_ROOT/libtitanox/brk_hook" \
            -I "$TX_ROOT/libtitanox/brk_hook/Hook" \
            -I "$TX_ROOT/libtitanox/utils" \
            -I "$TX_ROOT/libtitanox/MemX" \
            -I "$TX_ROOT/libtitanox/static-inline-hook" \
            ShadowBypassXK.mm $TX_SRCS \
            -framework Foundation -framework UIKit -framework Security \
            -framework CoreFoundation -framework CoreGraphics \
            -framework CoreSymbolication \
            -o ShadowBypassXK.dylib

      - name: Verify output
        run: |
          set -Eeuo pipefail
          file ShadowBypassXK.dylib
          lipo -info ShadowBypassXK.dylib
          otool -D ShadowBypassXK.dylib
          otool -L ShadowBypassXK.dylib | head -20
          echo "=== Hook classes present ==="
          nm -a ShadowBypassXK.dylib | grep -E "TitanoxHook|_OBJC_CLASS.*Titanox" || true
          echo "=== Custom hooks ==="
          nm -a ShadowBypassXK.dylib | grep -E "hk_|repl_" | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowBypassXK
          path: ShadowBypassXK.dylib
