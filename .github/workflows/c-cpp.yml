name: build-shadowxk

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: List repo files
        run: ls -la

      - name: Syntax check — ShadowBypassXK.m
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -O0 \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            -fsyntax-only \
            ShadowBypassXK.m

      - name: Syntax check — ShadowMonitorXK.m
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -O0 \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            -fsyntax-only \
            ShadowMonitorXK.m

      - name: Build ShadowBypassXK.dylib
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -fblocks -O2 -dynamiclib \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            ShadowBypassXK.m \
            -framework Foundation -framework UIKit -framework Security \
            -framework AdSupport -framework AppTrackingTransparency \
            -o ShadowBypassXK.dylib

      - name: Build ShadowMonitorXK.dylib
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -fblocks -O2 -dynamiclib \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -Wno-deprecated-declarations \
            ShadowMonitorXK.m \
            -framework Foundation -framework UIKit -framework Security \
            -o ShadowMonitorXK.dylib

      - name: Verify outputs
        run: |
          file ShadowBypassXK.dylib ShadowMonitorXK.dylib
          echo "---"
          otool -L ShadowBypassXK.dylib
          echo "---"
          otool -L ShadowMonitorXK.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadowXK-dylibs
          path: |
            ShadowBypassXK.dylib
            ShadowMonitorXK.dylib
          if-no-files-found: error
