name: Build MyHook

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  THEOS: /opt/theos
  TWEAK_NAME: MyHook

jobs:
  # ============================================================
  # Job 1: Build
  # ============================================================
  build:
    name: Build on macOS
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      # ---------- 1. Checkout ----------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- 2. Setup Xcode ----------
      - name: 🛠️ Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          echo "=== SDK Path ==="
          xcrun --sdk iphoneos --show-sdk-path

      # ---------- 3. Cache Theos ----------
      - name: 💾 Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: ${{ runner.os }}-theos-v2
          restore-keys: |
            ${{ runner.os }}-theos-

      # ---------- 4. Install Theos ----------
      - name: 📦 Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          echo "📦 Installing Theos..."
          sudo mkdir -p $THEOS
          sudo chown -R $(id -u):$(id -g) $THEOS
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git $THEOS
          sudo $THEOS/bin/install-theos || true
          echo "✅ Theos installed"

      # ---------- 5. Configure Theos ----------
      - name: 🔧 Configure Theos
        run: |
          export THEOS=$THEOS
          export PATH=$THEOS/bin:$PATH
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          
          echo "=== Theos makefiles ==="
          ls -la $THEOS/makefiles/ | head -20
          
          echo "=== Theos bin ==="
          ls -la $THEOS/bin/ | head -20

      # ---------- 6. Install ldid + dpkg ----------
      - name: 🔐 Install ldid & dpkg
        run: |
          echo "🔐 Installing ldid..."
          brew install ldid dpkg || true
          
          # ربط ldid مع Theos
          if [ -f "$(which ldid)" ]; then
            cp $(which ldid) $THEOS/bin/ldid
            chmod +x $THEOS/bin/ldid
            echo "✅ ldid linked to Theos"
          fi
          
          which dpkg-deb || echo "⚠️ dpkg-deb not found"

      # ---------- 7. Verify project structure ----------
      - name: 📋 Verify project structure
        run: |
          echo "=== Root files ==="
          ls -la
          
          echo "=== Check Makefile ==="
          test -f Makefile && echo "✅ Makefile found" || (echo "❌ Makefile missing"; exit 1)
          
          echo "=== Check MyHook.mm ==="
          test -f MyHook.mm && echo "✅ MyHook.mm found" || (echo "❌ MyHook.mm missing"; exit 1)
          
          echo "=== Check control ==="
          test -f control && echo "✅ control found" || echo "⚠️ control missing"
          
          echo "=== Check dobby.h ==="
          test -f dobby.h && echo "✅ dobby.h found" || echo "⚠️ dobby.h missing"
          
          echo "=== Check libdobby.a ==="
          test -f libdobby.a && echo "✅ libdobby.a found" || echo "⚠️ libdobby.a missing"

      # ---------- 8. Verify Dobby library ----------
      - name: 📋 Verify Dobby library
        run: |
          if [ -f "libdobby.a" ]; then
            echo "=== Dobby Architecture ==="
            lipo -info libdobby.a || echo "⚠️ lipo failed"
            
            echo "=== Dobby File Type ==="
            file libdobby.a
            
            echo "=== Dobby Size ==="
            ls -lh libdobby.a
            
            echo "=== Dobby Symbols (first 10) ==="
            nm libdobby.a 2>/dev/null | head -20 || true
          else
            echo "❌ libdobby.a not found"
            exit 1
          fi

      # ---------- 9. Build with Theos ----------
      - name: 🔨 Build with Theos
        run: |
          export THEOS=$THEOS
          export PATH=$THEOS/bin:$PATH
          
          echo "=== Starting build ==="
          make clean || true
          
          make package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e" \
            TARGET=${{ env.TWEAK_NAME }} \
            -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log
          
          echo "=== Build exit code: $? ==="

      # ---------- 10. Verify build output ----------
      - name: 🔍 Verify build output
        run: |
          echo "=== Packages directory ==="
          ls -la packages/ 2>/dev/null || echo "No packages/"
          
          echo "=== Theos obj directory ==="
          find .theos -type f -name "*.dylib" 2>/dev/null || echo "No dylibs"
          
          DYLIB=$(find .theos -name "*.dylib" -type f 2>/dev/null | head -1)
          if [ -n "$DYLIB" ]; then
            echo "✅ Found dylib: $DYLIB"
            echo "=== Architecture ==="
            lipo -info "$DYLIB"
            echo "=== Size ==="
            ls -lh "$DYLIB"
          fi
          
          DEB=$(find packages -name "*.deb" -type f 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            echo "✅ Found deb: $DEB"
            ls -lh "$DEB"
          fi

      # ---------- 11. Upload build log ----------
      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 12. Upload .deb package ----------
      - name: 📤 Upload deb package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-deb
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      # ---------- 13. Upload .dylib ----------
      - name: 📤 Upload dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 30

      # ---------- 14. Create Release (on tag) ----------
      - name: 🚀 Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            .theos/obj/**/*.dylib
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 2: Lint & Static Analysis
  # ============================================================
  lint:
    name: Lint & Static Analysis
    runs-on: macos-14
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 🔍 Clang Static Analyzer
        run: |
          echo "=== Analyzing MyHook.mm ==="
          xcrun -sdk iphoneos clang --analyze \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -arch arm64 \
            -fobjc-arc \
            -fmodules \
            -I . \
            MyHook.mm 2>&1 || true
          echo "✅ Analysis complete"

      - name: 📋 Check file sizes
        run: |
          echo "=== File sizes ==="
          ls -lh *.mm *.h *.a 2>/dev/null || true
