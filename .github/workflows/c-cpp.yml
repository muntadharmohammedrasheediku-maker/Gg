name: build-shadowxk-unified

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: List repo
        run: ls -la

      - name: Download OpenSSL xcframework
        run: |
          set -Eeuo pipefail
          mkdir -p deps
          cd deps
          curl -fsSL -o openssl.zip \
            https://github.com/krzyzanowskim/OpenSSL/releases/download/3.3.2000/OpenSSL.xcframework.zip
          unzip -q openssl.zip
          rm -f openssl.zip
          echo "=== Full tree (depth 4) ==="
          find OpenSSL.xcframework -maxdepth 4 | head -100

      - name: Auto-detect OpenSSL paths
        run: |
          set -Eeuo pipefail
          ROOT="$PWD/deps/OpenSSL.xcframework"
          
          # ابحث عن evp.h داخل الـxcframework — الجهاز الحقيقي فقط
          EVP_DEV=$(find "$ROOT" -path '*ios-arm64*/openssl/evp.h' ! -path '*simulator*' | head -1)
          
          if [ -z "$EVP_DEV" ]; then
            echo "=== evp.h not found in ios-arm64*, trying any ==="
            EVP_DEV=$(find "$ROOT" -name 'evp.h' -path '*openssl*' | head -3)
            echo "$EVP_DEV"
          fi
          
          if [ -z "$EVP_DEV" ]; then
            echo "FATAL: cannot find openssl/evp.h anywhere"
            find "$ROOT" -name '*.h' | head -20
            exit 1
          fi
          
          echo "Found evp.h at: $EVP_DEV"
          
          # استخرج مجلد include (المجلد اللي فيه openssl/)
          INC_DIR=$(echo "$EVP_DEV" | sed 's|/openssl/evp.h||')
          echo "Include dir: $INC_DIR"
          
          # استخرج lib dir — من مسار evp.h صعود للجذر
          # عادة: <slice>/<headers>/openssl/evp.h و <slice>/lib*.a
          SLICE_DIR=$(echo "$EVP_DEV" | sed 's|/Headers/openssl/evp.h||')
          if [ "$SLICE_DIR" = "$EVP_DEV" ]; then
            SLICE_DIR=$(echo "$EVP_DEV" | sed 's|/include/openssl/evp.h||')
          fi
          if [ "$SLICE_DIR" = "$EVP_DEV" ]; then
            SLICE_DIR=$(echo "$EVP_DEV" | sed 's|/openssl/evp.h||')
            SLICE_DIR=$(dirname "$SLICE_DIR")
          fi
          echo "Slice dir: $SLICE_DIR"
          
          # ابحث عن libcrypto.a و libssl.a
          LIBCRYPTO=$(find "$SLICE_DIR" -name 'libcrypto.a' -o -name 'libcrypto_static.a' | head -1)
          LIBSSL=$(find "$SLICE_DIR" -name 'libssl.a' -o -name 'libssl_static.a' | head -1)
          
          if [ -z "$LIBCRYPTO" ]; then
            echo "=== libcrypto.a not in slice, searching whole xcframework ==="
            LIBCRYPTO=$(find "$ROOT" -name 'libcrypto*.a' ! -path '*simulator*' | head -1)
          fi
          if [ -z "$LIBSSL" ]; then
            LIBSSL=$(find "$ROOT" -name 'libssl*.a' ! -path '*simulator*' | head -1)
          fi
          
          if [ -z "$LIBCRYPTO" ]; then
            echo "=== libcrypto.a not found as static, checking framework ==="
            LIBCRYPTO=$(find "$ROOT" -name 'OpenSSL' -path '*ios-arm64*' ! -path '*simulator*' | head -1)
            LIBSSL=""
          fi
          
          echo "LibCrypto: $LIBCRYPTO"
          echo "LibSSL:    $LIBSSL"
          
          echo "OSSL_INC=$INC_DIR" >> $GITHUB_ENV
          echo "OSSL_LIBCRYPTO=$LIBCRYPTO" >> $GITHUB_ENV
          echo "OSSL_LIBSSL=$LIBSSL" >> $GITHUB_ENV
          
          # تحقق
          ls -la "$INC_DIR/openssl/" | head -10
          file "$LIBCRYPTO"

      - name: Verify OpenSSL headers
        run: |
          set -Eeuo pipefail
          echo "INC: $OSSL_INC"
          test -f "$OSSL_INC/openssl/evp.h" || { echo "evp.h missing"; exit 1; }
          test -f "$OSSL_INC/openssl/kdf.h" || { echo "kdf.h missing"; exit 1; }
          test -f "$OSSL_INC/openssl/core_names.h" || { echo "core_names.h missing"; exit 1; }
          test -f "$OSSL_INC/openssl/param_build.h" || { echo "param_build.h missing"; exit 1; }
          echo "All required headers present"

      - name: Compile defcrypto.o
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang++ -std=c++20 -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -O2 -fPIC \
            -fvisibility=hidden -fvisibility-inlines-hidden \
            -I "$OSSL_INC" \
            -c defcrypto.cpp -o defcrypto.o
          file defcrypto.o

      - name: Compile defcrypto_bridge.o
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang++ -std=c++20 -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -O2 -fPIC -fvisibility=hidden \
            -I "$OSSL_INC" \
            -c defcrypto_bridge.cpp -o defcrypto_bridge.o

      - name: Compile ShadowBypassXK.o
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -x objective-c++ -std=c++20 -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fPIC \
            -Wno-nullability-completeness -Wno-deprecated-declarations \
            -Wno-incompatible-pointer-types \
            -I "$OSSL_INC" -I . \
            -c ShadowBypassXK.m -o ShadowBypassXK.o

      - name: Compile ShadowMonitorXK.o
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -x objective-c++ -std=c++20 -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -fobjc-arc -fblocks -O2 -fPIC \
            -Wno-nullability-completeness -Wno-deprecated-declarations \
            -Wno-incompatible-pointer-types \
            -I "$OSSL_INC" -I . \
            -c ShadowMonitorXK.m -o ShadowMonitorXK.o

      - name: Link unified dylib
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          
          LIBS="$OSSL_LIBCRYPTO"
          if [ -n "$OSSL_LIBSSL" ]; then
            LIBS="$LIBS $OSSL_LIBSSL"
          fi
          
          clang++ -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=14.0 -dynamiclib -O2 \
            -o ShadowXK.dylib \
            defcrypto.o defcrypto_bridge.o \
            ShadowBypassXK.o ShadowMonitorXK.o \
            $LIBS \
            -framework Foundation -framework UIKit -framework Security \
            -framework AdSupport -lz
          file ShadowXK.dylib

      - name: Verify
        run: |
          set -Eeuo pipefail
          file ShadowXK.dylib
          echo "--- linked libs ---"
          otool -L ShadowXK.dylib
          echo "--- bridge exports ---"
          nm -gU ShadowXK.dylib | grep -E "sbxk_(encrypt|decrypt|wipe|random|has_hw)" || true
          echo "--- size ---"
          ls -lh ShadowXK.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShadowXK-unified
          path: ShadowXK.dylib
          if-no-files-found: error
