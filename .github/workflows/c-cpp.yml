name: Build MyHook Dylib

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    name: Build Dylib — arm64 + arm64e
    runs-on: macos-14
    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # XCODE
      # ============================================================
      - name: Setup Xcode
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

          xcodebuild -version

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$SDK"

          echo "iPhoneOS SDK: $SDK"

      # ============================================================
      # CACHE THEOS
      # ============================================================
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: /opt/theos
          key: ${{ runner.os }}-theos-v6

      # ============================================================
      # INSTALL THEOS
      # ============================================================
      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo mkdir -p "$THEOS"
          sudo chown -R "$(id -u):$(id -g)" "$THEOS"

          git clone \
            --recursive \
            --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          test -d "$THEOS/makefiles"
          test -d "$THEOS/bin"

          echo "Theos installed."

      # ============================================================
      # INSTALL LDID
      # ============================================================
      - name: Install ldid
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$THEOS/bin"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --output /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64

          test -s /tmp/ldid

          chmod +x /tmp/ldid
          install -m 755 /tmp/ldid "$THEOS/bin/ldid"

          test -x "$THEOS/bin/ldid"

          echo "ldid installed."

      # ============================================================
      # CONFIGURE THEOS
      # ============================================================
      - name: Configure Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          export PATH="$THEOS/bin:$PATH"

          test -d "$THEOS/makefiles"
          test -x "$THEOS/bin/ldid"

      # ============================================================
      # VERIFY PROJECT
      # ============================================================
      - name: Verify Project
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f Makefile
          test -f MyHook.mm
          test -f dobby.h
          test -f libdobby.a

          echo "Project files OK."

      # ============================================================
      # VERIFY DOBBY
      # ============================================================
      - name: Verify libdobby.a
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== libdobby.a ==="
          lipo -info libdobby.a

          ARCHS="$(lipo -archs libdobby.a)"

          echo "$ARCHS" | grep -qw arm64 || {
            echo "ERROR: arm64 missing"
            exit 1
          }

          echo "$ARCHS" | grep -qw arm64e || {
            echo "ERROR: arm64e missing"
            exit 1
          }

          echo "libdobby.a: arm64 + arm64e"

      # ============================================================
      # THEOS BUILD
      # ============================================================
      - name: Build Dylib with Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          export THEOS="$THEOS"
          export PATH="$THEOS/bin:$PATH"

          rm -f build.log

          echo "=== CLEAN ==="
          make clean

          echo "=== BUILD DYLIB ==="

          make \
            package \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e" \
            -j"$(sysctl -n hw.ncpu)" \
            2>&1 | tee build.log

          echo "Theos build completed."

      # ============================================================
      # FIND ONLY DYLIB
      # ============================================================
      - name: Extract Dylib
        shell: bash
        run: |
          set -Eeuo pipefail

          DYLIB=".theos/obj/MyHook.dylib"

          if [ ! -f "$DYLIB" ]; then
            echo "ERROR: MyHook.dylib not found"
            echo "=== .theos/obj ==="
            find .theos/obj -maxdepth 3 -type f -print
            exit 1
          fi

          echo "=== Dylib ==="
          ls -lh "$DYLIB"

          echo "=== Architectures ==="
          lipo -info "$DYLIB"

          ARCHS="$(lipo -archs "$DYLIB")"

          echo "$ARCHS" | grep -qw arm64 || {
            echo "ERROR: arm64 missing"
            exit 1
          }

          echo "$ARCHS" | grep -qw arm64e || {
            echo "ERROR: arm64e missing"
            exit 1
          }

          echo "SUCCESS"
          echo "MyHook.dylib contains:"
          echo "  arm64"
          echo "  arm64e"

      # ============================================================
      # UPLOAD ONLY DYLIB
      # ============================================================
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-dylib-arm64-arm64e
          path: .theos/obj/MyHook.dylib
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # BUILD LOG
      # ============================================================
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyHook-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
