name: build-shadowbypass

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fetch fishhook (fallback if submodule missing)
        run: |
          if [ ! -f deps/fishhook/fishhook.h ]; then
            mkdir -p deps/fishhook
            curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o deps/fishhook/fishhook.h
            curl -fsSL https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o deps/fishhook/fishhook.c
          fi

      - name: Syntax check
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc -O0 \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -fsyntax-only \
            -I deps \
            ShadowBypassXK.m

      - name: Build dylib
        run: |
          set -Eeuo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=13.0 \
            -fobjc-arc -O2 -dynamiclib \
            -Wno-incompatible-pointer-types \
            -Wno-implicit-function-declaration \
            -Wno-nullability-completeness \
            -I deps \
            ShadowBypassXK.m deps/fishhook/fishhook.c \
            -framework Foundation -framework UIKit -framework Security \
            -framework AdSupport -framework AppTrackingTransparency \
            -o ShadowBypassXK.dylib

      - name: Verify output
        run: |
          file ShadowBypassXK.dylib
          otool -L ShadowBypassXK.dylib
          nm -u ShadowBypassXK.dylib | grep -E "fishhook|RSA_|AES_" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowBypassXK
          path: ShadowBypassXK.dylib
